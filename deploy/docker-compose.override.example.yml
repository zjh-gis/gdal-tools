# override.yml 不要提交；里面是本机路径。

services:
  gdal-tools:
    volumes:
      - ${MCP_DATA:-/data}:/data
      # 若业务数据不在 MCP_DATA 目录树内，再额外挂进来：
      # - /path/on/host/to/gdem:/data/dem/gdem:ro
      # - /path/on/host/to/srtm:/data/dem/srtm:ro
