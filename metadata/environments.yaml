version: "1.0"
description: >
  gdal-tools 的运行环境。本包只有一个镜像、一个环境、一个 MCP 服务。
  输入读取和结果写入都只允许在挂载工作区（容器内 /data，宿主机 MCP_DATA）内。

environments:
  - id: gdal-tools://environment/gdal
    slug: gdal
    name: GDAL/OGR 栅格、矢量与 DEM
    mcp_server_id: gdal-tools
    docker:
      compose: deploy/docker-compose.yml
      dockerfile: docker/gdal.Dockerfile
      image: gdal-tools:1.0
    includes:
      system:
        - gdal-bin
        - python3-gdal
        - proj
        - geos
      python:
        - rasterio
        - geopandas
        - pyogrio
        - pyproj
        - numpy
        - PyYAML
        - mcp
        - pydantic
    workspace:
      env: GDAL_TOOLS_WORKSPACES
      alias: MCP_WORKSPACES
      default: /data
      host_volume_env: MCP_DATA
      description: >
        容器内工作区根目录。宿主机 MCP_DATA 挂到此处。
        data_path / output_path 都必须在此根下；没有默认 outputs 子目录。
    tool_id_prefixes:
      - gdal.
    tool_ids:
      - gdal.raster_info
      - gdal.raster_convert
      - gdal.raster_warp
      - gdal.raster_build_vrt
      - gdal.raster_calc
      - gdal.raster_overviews
      - gdal.raster_polygonize
      - gdal.dem_slope
      - gdal.dem_aspect
      - gdal.dem_hillshade
      - gdal.dem_terrain_index
      - gdal.dem_contour
      - gdal.vector_info
      - gdal.vector_convert
    notes: >
      与 python -m gdal_tools list 及 gdal_tools/contracts/tools/*.yaml 一致。
      旧别名 gdal.translate / gdal.warp / gdal.build_vrt / gdal.overviews / gdal.polygonize
      仍可调用，契约 id 以上面列表为准。
      长任务在 MCP 内并发，上限 GDAL_TOOLS_MAX_CONCURRENT_JOBS。

defaults:
  workspace_env_var: GDAL_TOOLS_WORKSPACES
  pythonpath_env_var: PYTHONPATH
  transport:
    local_dev: stdio
    linux_server: sse
  docker:
    compose: deploy/docker-compose.yml
    image: gdal-tools:1.0
    port: 7861
