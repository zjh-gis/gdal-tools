version: "1.0"
description: >
  gdal-tools 已发布工具目录。机器可读契约以 gdal_tools/contracts/tools/*.yaml 为准。
  输入和输出路径都必须在挂载工作区（容器内 /data，宿主机 MCP_DATA）内。
environment_id: gdal-tools://environment/gdal
runtime:
  image: gdal-tools:1.0
  compose: deploy/docker-compose.yml
  workspace_env: GDAL_TOOLS_WORKSPACES
  workspace_default: /data
tools:
  - id: gdal.raster_info
    mcp_name: raster_info
    name: 栅格元数据
    category: inspect
    capability: [raster_info]
    call_mode: executable
    long_running: false
    description: 读取栅格 CRS、尺寸、波段、nodata、金字塔，可选统计值。
    input:
      data_type: 栅格
      format: GDAL 可读栅格
      requirement: 工作区内本地文件路径
    output:
      data_type: JSON 元数据
    limitation:
      - 不写出新栅格；statistics=true 时 GDAL 可能写 .aux.xml
  - id: gdal.raster_convert
    mcp_name: raster_convert
    name: 栅格转换/矩形裁剪
    category: raster
    capability: [raster_convert]
    call_mode: executable
    long_running: true
    description: 转换格式、选波段、改数据类型，或按矩形截取。
    input:
      data_type: 栅格
      format: GDAL 可读栅格
      requirement: 工作区内本地文件；须给 output_path
    output:
      data_type: 栅格
      format: GeoTIFF / COG / VRT / PNG
    limitation:
      - 按多边形裁剪请用 gdal.raster_warp
  - id: gdal.raster_warp
    mcp_name: raster_warp
    name: 重投影/重采样/镶嵌/按边界裁剪
    category: raster
    capability: [raster_reproject, raster_clip, raster_resample, raster_mosaic]
    call_mode: executable
    long_running: true
    description: 用 gdalwarp 重投影、重采样、镶嵌，或按 bbox/矢量裁剪。
    input:
      data_type: 栅格；可选裁剪矢量
      format: GDAL 栅格；裁剪边界为面矢量
      requirement: data_path 或 data_paths 至少一个；须给 output_path
    output:
      data_type: 栅格
      format: GeoTIFF
    limitation:
      - 多个输入镶嵌时 CRS 与波段结构应一致
  - id: gdal.raster_build_vrt
    mcp_name: raster_build_vrt
    name: 虚拟镶嵌/波段堆叠
    category: raster
    capability: [raster_mosaic]
    call_mode: executable
    long_running: true
    description: 构建 VRT，不复制像元，适合大量分幅。
    input:
      data_type: 多个栅格
      format: GDAL 可读栅格，须同一 CRS
      requirement: 工作区内路径列表；output_path 须以 .vrt 结尾
    output:
      data_type: 虚拟栅格
      format: VRT
    limitation:
      - VRT 只引用源文件，源文件移动后失效
      - 不做重投影
  - id: gdal.raster_calc
    mcp_name: raster_calc
    name: 波段计算
    category: raster
    capability: [raster_calculate]
    call_mode: executable
    long_running: true
    description: 逐像元波段运算（指数、掩膜、阈值、重分类）。
    input:
      data_type: 一个或多个栅格
      format: GDAL 可读栅格
      requirement: 输入以单字母 A–Z 命名；须给 output_path
    output:
      data_type: 栅格
      format: GeoTIFF
    limitation:
      - 表达式只允许白名单内的算术、比较和 numpy 函数
  - id: gdal.raster_overviews
    mcp_name: raster_overviews
    name: 构建/清除金字塔
    category: raster
    capability: [raster_overviews]
    call_mode: executable
    long_running: true
    description: 构建或清除金字塔，加速大图显示。
    input:
      data_type: 栅格
      format: GeoTIFF / COG 等
      requirement: 缺省原地写入；external=true 时写 .ovr
    output:
      data_type: 金字塔（内部或外挂 .ovr）
    limitation:
      - 默认会修改输入文件，除非 external=true
  - id: gdal.raster_polygonize
    mcp_name: raster_polygonize
    name: 栅格转面
    category: conversion
    capability: [raster_polygonize]
    call_mode: executable
    long_running: true
    description: 把相同像元值的连通区转为多边形。
    input:
      data_type: 类别栅格
      format: GDAL 可读栅格
      requirement: 工作区内路径；须给 output_path
    output:
      data_type: 面矢量
      format: GPKG / GeoJSON / FlatGeobuf
    limitation:
      - 连续值栅格应先阈值化为类别栅格
  - id: gdal.dem_slope
    mcp_name: dem_slope
    name: DEM 坡度
    category: terrain
    capability: [dem_slope]
    call_mode: executable
    long_running: true
    description: 由 DEM 计算坡度（度或百分比）。
    input:
      data_type: DEM
      format: GeoTIFF / COG / VRT / SRTMHGT 等
      requirement: 工作区内路径；须给 output_path
    output:
      data_type: 坡度栅格
      format: GeoTIFF
    limitation:
      - 经纬度 DEM（高程为米）须设 scale=111120，否则结果会警告
  - id: gdal.dem_aspect
    mcp_name: dem_aspect
    name: DEM 坡向
    category: terrain
    capability: [dem_aspect]
    call_mode: executable
    long_running: true
    description: 由 DEM 计算坡向（缺省 0°=正北、顺时针）。
    input:
      data_type: DEM
      format: GeoTIFF / COG / VRT / SRTMHGT 等
      requirement: 工作区内路径；须给 output_path
    output:
      data_type: 坡向栅格
      format: GeoTIFF
    limitation:
      - 平坦区缺省为 -9999，除非 zero_for_flat
  - id: gdal.dem_hillshade
    mcp_name: dem_hillshade
    name: DEM 山体阴影
    category: terrain
    capability: [dem_hillshade]
    call_mode: executable
    long_running: true
    description: 由 DEM 生成山体阴影 Byte 栅格。
    input:
      data_type: DEM
      format: GeoTIFF / COG / VRT / SRTMHGT 等
      requirement: 工作区内路径；须给 output_path
    output:
      data_type: 山体阴影栅格
      format: GeoTIFF
    limitation:
      - 经纬度 DEM 须设 scale=111120
  - id: gdal.dem_terrain_index
    mcp_name: dem_terrain_index
    name: DEM 地形指数
    category: terrain
    capability: [terrain_index]
    call_mode: executable
    long_running: true
    description: 计算 TRI、TPI 或 roughness。
    input:
      data_type: DEM
      format: GeoTIFF / COG / VRT / SRTMHGT 等
      requirement: 工作区内路径；须给 output_path
    output:
      data_type: 地形指数栅格
      format: GeoTIFF
    limitation:
      - 结果单位与输入高程单位相同
  - id: gdal.dem_contour
    mcp_name: dem_contour
    name: DEM 等值线
    category: terrain
    capability: [contour_extract]
    call_mode: executable
    long_running: true
    description: 由 DEM 提取等值线或等值面。
    input:
      data_type: DEM
      format: GeoTIFF / COG / VRT / SRTMHGT 等
      requirement: interval 与 fixed_levels 二选一；须给 output_path
    output:
      data_type: 等值线/等值面矢量
      format: GPKG / GeoJSON / FlatGeobuf
    limitation:
      - 输出沿用输入 CRS
  - id: gdal.vector_info
    mcp_name: vector_info
    name: 矢量元数据
    category: inspect
    capability: [vector_info]
    call_mode: executable
    long_running: false
    description: 读取图层、几何类型、CRS、范围与要素数。
    input:
      data_type: 矢量
      format: OGR 可读矢量
      requirement: 工作区内本地文件路径
    output:
      data_type: JSON 元数据
    limitation:
      - 不写出新矢量
  - id: gdal.vector_convert
    mcp_name: vector_convert
    name: 矢量转换/重投影/过滤
    category: vector
    capability: [vector_convert, coordinate_transform]
    call_mode: executable
    long_running: true
    description: 转换格式、重投影，或按范围/属性过滤。
    input:
      data_type: 矢量
      format: OGR 可读矢量
      requirement: 工作区内路径；须给 output_path
    output:
      data_type: 矢量
      format: GPKG / GeoJSON / Shapefile / FlatGeobuf
    limitation:
      - Shapefile 字段名长度受限
