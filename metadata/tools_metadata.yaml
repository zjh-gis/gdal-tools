version: "0.2"
description: "Geoscience professional tool and model asset metadata for Task 1.2."
metadata_template:
  required_fields:
    - id
    - name
    - category
    - source
    - capability_boundary
    - applicable_task
    - input_requirement
    - output_type
    - runtime_condition
    - limitation
    - call_mode
    - related_agent
    - handoff_rule
tools:
  - id: rs_radiometric_correction
    name: 遥感影像辐射校正工具
    category: 遥感
    source: 开源遥感处理库、专业遥感软件或平台已有工具
    capability_boundary: 支持遥感影像基础处理、信息增强和异常辅助提取，结果需结合地质背景解释
    applicable_task: 遥感影像预处理
    input_requirement:
      data_type: 多光谱或高光谱遥感影像
      format: GeoTIFF、ENVI或平台栅格数据
      requirement: 具备坐标参考、波段信息和研究区范围
    output_type:
      data_type: 处理后遥感影像、异常图层或统计摘要
      format: GeoTIFF、GeoJSON、PNG或JSON
    runtime_condition:
      environment: Python + GDAL/rasterio/numpy或平台遥感工具
      compute: CPU，较大影像可使用并行或切片处理
    limitation:
      - 影像质量、云量和波段配置会影响结果可靠性
      - 异常提取结果需结合地质、地化和专家经验复核
    call_mode: indexed_or_lightweight_service
    related_agent:
      - 知识智能体
      - 假说智能体
    handoff_rule: 知识智能体可提供工具推荐和轻量调用结果，下游异常解释由假说智能体结合多源证据完成
