  - id: rs_vegetation_index
    name: 遥感植被指数与叶面积指数计算工具
    category: 遥感
    source: 开源遥感处理库、专业遥感软件或平台已有工具
    capability_boundary: 支持从多光谱影像计算NDVI、EVI、SAVI、NDWI和经验LAI，结果受波段配置、辐射定标和植被类型影响
    applicable_task: 植被指数与叶面积指数计算
    input_requirement:
      data_type: 多光谱遥感影像
      format: GeoTIFF
      requirement: 具备红光和近红外波段；EVI需蓝光波段，NDWI需绿光或短波红外波段
    output_type:
      data_type: 植被指数栅格和统计摘要
      format: GeoTIFF、JSON
    runtime_condition:
      environment: Python + rasterio/numpy
      compute: CPU，较大影像可使用切片处理
    limitation:
      - LAI由NDVI或EVI经验关系反演，不是物理辐射传输模型
      - 未做大气校正的DN值会显著影响指数数值
    call_mode: lightweight_service
    related_agent:
      - 知识智能体
      - 假说智能体
    handoff_rule: 知识智能体可提供轻量指数计算结果，复杂LAI反演或物候分析可转交下游专业模型
