version: "1.0"
description: >
  gdal-tools 的执行约定。本包工具全部可在本镜像内直接执行，不转交其他智能体。
  输入读取和结果写入都只允许在挂载工作区（容器内 /data，宿主机 MCP_DATA）内。

environment_id: gdal-tools://environment/gdal

call_mode:
  executable:
    label: 在本镜像内直接执行
    description: 本包全部工具都是 executable，没有 handoff。

execution:
  mode: sync
  interfaces: [cli, mcp]
  workspace:
    env: GDAL_TOOLS_WORKSPACES
    alias: MCP_WORKSPACES
    default: /data
    host_volume_env: MCP_DATA
    rule: data_path / output_path 等文件参数必须在工作区根下；不传 output_path 会报错，不会默认写到 outputs/
  timeout:
    inspect_seconds: 600
    compute_seconds: 14400
    env: GDAL_COMMAND_TIMEOUT_SECONDS
  concurrency:
    env: GDAL_TOOLS_MAX_CONCURRENT_JOBS
    default: 2
    applies_to: MCP 内 long_running 任务
  overwrite:
    default: false
    on_conflict: 输出已存在且 overwrite=false 时返回 output_exists
  commit:
    geotiff: 先写临时文件再替换，避免半成品
  progress: long_running 工具通过 MCP 上报进度

attributes:
  long_running:
    description: 计算类工具为 true；raster_info / vector_info 为 false
    tools_false: [gdal.raster_info, gdal.vector_info]
  idempotent:
    description: 相同输入与参数应得到相同输出文件
    default: true
  in_place:
    description: 仅 gdal.raster_overviews 在 external=false 时原地改输入文件
    tools: [gdal.raster_overviews]

errors:
  invalid_argument: {exit_code: 2, retryable: false}
  path_not_allowed: {exit_code: 3, retryable: false}
  not_found: {exit_code: 4, retryable: false}
  output_exists: {exit_code: 5, retryable: false}
  gdal_unavailable: {exit_code: 10, retryable: false}
  gdal_timeout: {exit_code: 11, retryable: true}
  gdal_failed: {exit_code: 12, retryable: false}
  internal_error: {exit_code: 1, retryable: false}
