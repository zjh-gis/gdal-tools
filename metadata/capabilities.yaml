version: "1.0"
description: >
  gdal-tools 的原子能力词表。只覆盖本包已发布工具。
  权威契约在 gdal_tools/contracts/tools/*.yaml。
_meta:
  owner: gdal-tools
  environment_id: gdal-tools://environment/gdal
capabilities:
  raster_info:
    label: 栅格元数据
    family: inspect
    typical_input_types: [raster]
    typical_output_types: [metadata]
    example_tools: [gdal.raster_info]
  vector_info:
    label: 矢量元数据
    family: inspect
    typical_input_types: [vector]
    typical_output_types: [metadata]
    example_tools: [gdal.vector_info]
  raster_convert:
    label: 栅格格式转换
    family: transform
    typical_input_types: [raster]
    typical_output_types: [raster]
    example_tools: [gdal.raster_convert]
  raster_reproject:
    label: 栅格重投影
    family: transform
    definition: 改变输出坐标系。同 CRS 下只改像元大小用 raster_resample。
    typical_input_types: [raster]
    typical_output_types: [raster]
    example_tools: [gdal.raster_warp]
  raster_resample:
    label: 栅格重采样
    family: transform
    definition: 改变像元大小/网格，不隐含改 CRS。
    typical_input_types: [raster]
    typical_output_types: [raster]
    example_tools: [gdal.raster_warp]
  raster_clip:
    label: 栅格裁剪
    family: transform
    definition: 按 bbox 或矢量边界裁剪栅格。
    typical_input_types: [raster]
    typical_output_types: [raster]
    example_tools: [gdal.raster_warp]
  raster_mosaic:
    label: 栅格镶嵌
    family: transform
    typical_input_types: [raster]
    typical_output_types: [raster]
    example_tools: [gdal.raster_warp, gdal.raster_build_vrt]
  raster_calculate:
    label: 栅格波段计算
    family: transform
    definition: 逐像元波段运算（指数、掩膜、阈值、重分类）。
    typical_input_types: [raster]
    typical_output_types: [raster]
    example_tools: [gdal.raster_calc]
  raster_overviews:
    label: 栅格金字塔
    family: transform
    typical_input_types: [raster]
    typical_output_types: [raster]
    example_tools: [gdal.raster_overviews]
  raster_polygonize:
    label: 栅格转面
    family: transform
    typical_input_types: [raster]
    typical_output_types: [vector]
    example_tools: [gdal.raster_polygonize]
  dem_slope:
    label: DEM 坡度
    family: analyze
    typical_input_types: [dem]
    typical_output_types: [raster]
    example_tools: [gdal.dem_slope]
  dem_aspect:
    label: DEM 坡向
    family: analyze
    typical_input_types: [dem]
    typical_output_types: [raster]
    example_tools: [gdal.dem_aspect]
  dem_hillshade:
    label: DEM 山体阴影
    family: analyze
    typical_input_types: [dem]
    typical_output_types: [raster]
    example_tools: [gdal.dem_hillshade]
  terrain_index:
    label: DEM 地形指数
    family: analyze
    definition: TRI / TPI / roughness。
    typical_input_types: [dem]
    typical_output_types: [raster]
    example_tools: [gdal.dem_terrain_index]
  contour_extract:
    label: DEM 等值线
    family: analyze
    typical_input_types: [dem]
    typical_output_types: [vector]
    example_tools: [gdal.dem_contour]
  vector_convert:
    label: 矢量格式转换
    family: transform
    typical_input_types: [vector]
    typical_output_types: [vector]
    example_tools: [gdal.vector_convert]
  coordinate_transform:
    label: 矢量重投影
    family: transform
    typical_input_types: [vector]
    typical_output_types: [vector]
    example_tools: [gdal.vector_convert]
capability_families:
  inspect:
    atomic_ids: [raster_info, vector_info]
  transform:
    atomic_ids:
      - raster_convert
      - raster_reproject
      - raster_resample
      - raster_clip
      - raster_mosaic
      - raster_calculate
      - raster_overviews
      - raster_polygonize
      - vector_convert
      - coordinate_transform
  analyze:
    atomic_ids:
      - dem_slope
      - dem_aspect
      - dem_hillshade
      - terrain_index
      - contour_extract
operation_capability_resolver:
  inspect_metadata:
    raster: [raster_info]
    vector: [vector_info]
  convert:
    raster: [raster_convert]
    vector: [vector_convert]
  reproject:
    raster: [raster_reproject]
    vector: [coordinate_transform]
  resample:
    raster: [raster_resample]
  clip:
    raster: [raster_clip]
  mosaic:
    raster: [raster_mosaic]
  calculate:
    raster: [raster_calculate]
  polygonize:
    raster: [raster_polygonize]
  terrain:
    raster: [dem_slope, dem_aspect, dem_hillshade, terrain_index, contour_extract]
