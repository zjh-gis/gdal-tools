    typical_input_types: []
    typical_output_types: []
    example_tools:
    - uncertainty_buffer_overlap
    - uncertainty_idw_variance
    - uncertainty_multisource_consistency
  spectral_index:
    label: spectral index
    family: analyze
    typical_input_types:
    - multispectral_raster
    typical_output_types:
    - vegetation_index_raster
    example_tools:
