    family: analyze
    typical_input_types:
    - geochemical_table
    typical_output_types:
    - element_combination_result
    example_tools:
    - element_combination
    - geochem_au_bi_as
    - geochem_element_combination
  element_correlation:
    label: element correlation
    family: analyze
    typical_input_types: []
    typical_output_types: []
    example_tools:
    - geochem_correlation
  evidence_align:
    label: evidence align
    family: transform
    typical_input_types: []
    typical_output_types: []
    example_tools:
    - geophysics_grid_align
  evidence_reclass:
    label: evidence reclass
    family: transform
    typical_input_types: []
    typical_output_types: []
    example_tools:
    - geophysics_evidence_reclass
  evidence_stack:
    label: evidence stack
    family: transform
    typical_input_types: []
    typical_output_types: []
    example_tools:
    - geophysics_evidence_stack
  evidence_vectorize:
    label: evidence vectorize
    family: transform
    typical_input_types: []
    typical_output_types: []
    example_tools:
    - geophysics_anomaly_vectorize
  geochemical_anomaly_detection:
    label: geochemical anomaly detection
    family: analyze
    typical_input_types:
    - geochemical_table
    typical_output_types:
    - geochemical_anomaly
    example_tools:
    - geochem_anomaly
    - geochem_anomaly_threshold
