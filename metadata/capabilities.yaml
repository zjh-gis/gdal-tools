  prospectivity_evidence_weights:
    label: prospectivity evidence weights
    family: analyze
    typical_input_types: []
    typical_output_types: []
    example_tools:
    - prospectivity_evidence_weights
  prospectivity_mapping:
    label: prospectivity mapping
    family: analyze
    typical_input_types: []
    typical_output_types: []
    example_tools:
    - prospectivity_evidence_weights
