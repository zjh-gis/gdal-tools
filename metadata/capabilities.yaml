version: '0.2'
description: Canonical atomic capability vocabulary for GeoInvoke. Benchmark Gold must use only capabilities.*.
  deprecated.* may appear in legacy tool metadata and resolver mappings, but not in Gold.
_meta:
  owner: geoinvoke
  atomic_tier_field: capability_id
  family_tier_field: family
  family_used_in_ranking: false
  scorer_uses: canonical capability ids only for Gold and required_capabilities
  deprecated_policy: >
    deprecated.replacement is migration metadata for CI/audit only.
    Query capability resolver MUST NOT expand deprecated ids into multiple
    required_capabilities.
  gold_policy: capability_gold.required must be canonical only (not deprecated)
capabilities:
  alteration_detection:
    label: alteration detection
    family: analyze
    typical_input_types:
    - multispectral_raster
    typical_output_types:
    - alteration_anomaly
    example_tools:
    - alteration_extraction
  analytic_signal:
    label: analytic signal
    family: transform
    typical_input_types: []
    typical_output_types: []
    example_tools:
    - geophysics_analytic_signal
  assay_stats:
    label: assay stats
    family: analyze
    typical_input_types: []
    typical_output_types: []
    example_tools:
    - assay_descriptive_stats
  buffer_overlap:
    label: buffer overlap
    family: analyze
    typical_input_types: []
    typical_output_types: []
    example_tools:
    - uncertainty_buffer_overlap
  contour_extract:
    label: contour extract
    family: analyze
    typical_input_types: []
    typical_output_types: []
    example_tools:
    - spatial_contour_extract
    - gdal.dem_contour
  coordinate_transform:
    label: coordinate transform
    family: transform
    typical_input_types:
