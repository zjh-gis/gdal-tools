  qaqc_standard:
    label: qaqc standard
    family: analyze
    typical_input_types: []
    typical_output_types: []
    example_tools:
    - qaqc_standard_recovery
  raster_clip:
    label: raster clip
    family: transform
    definition: Crop a raster by bbox or vector cutline without requiring a CRS change.
    typical_input_types:
    - raster
    typical_output_types:
    - raster
    example_tools:
    - gdal.warp
  raster_calculate:
    label: raster calculate
    family: transform
    definition: >
      Per-pixel band math over one or more rasters (indices, masks, thresholds,
      reclassification). Named spectral indices with a dedicated tool stay spectral_index.
    typical_input_types:
    - raster
    typical_output_types:
    - raster
    example_tools:
    - gdal.raster_calc
  raster_convert:
    label: raster convert
    family: transform
    typical_input_types:
    - raster
    typical_output_types:
    - raster
    example_tools:
    - gdal.translate
  raster_info:
    label: raster info
    family: inspect
    typical_input_types:
    - raster
    typical_output_types:
    - metadata
    example_tools:
    - gdal.raster_info
  raster_mosaic:
    label: raster mosaic
    family: transform
    typical_input_types:
    - raster
    typical_output_types:
    - raster
    example_tools:
    - gdal.warp
    - gdal.build_vrt
  raster_overviews:
    label: raster overviews
    family: transform
    definition: Build or remove reduced-resolution pyramids for faster display of large rasters.
    typical_input_types:
    - raster
    typical_output_types:
    - raster
    example_tools:
    - gdal.overviews
  raster_polygonize:
    label: raster polygonize
    family: transform
    definition: Convert connected regions of equal pixel value into vector polygons.
    typical_input_types:
    - raster
    typical_output_types:
    - vector
    example_tools:
    - gdal.polygonize
  raster_reproject:
    label: raster reproject
    family: transform
    definition: >
      Change the output coordinate reference system (CRS). Same-CRS grid
      resampling is NOT raster_reproject; use raster_resample.
    typical_input_types:
    - raster
    typical_output_types:
    - raster
    example_tools:
    - gdal.warp
  raster_resample:
    label: raster resample
    family: transform
    definition: >
      Change pixel size / grid sampling. Does not imply changing CRS.
      Same-CRS resampling stays raster_resample even if implemented via warp/reproject APIs.
    typical_input_types:
    - raster
    typical_output_types:
    - raster
    example_tools:
    - gis_raster_resampling
    - gdal.warp
  semantic_segmentation:
    label: semantic segmentation
    family: analyze
    typical_input_types:
    - remote_sensing_raster
    typical_output_types:
    - segmentation_mask
    example_tools:
