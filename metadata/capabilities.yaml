  upward_continuation:
    label: upward continuation
    family: transform
    typical_input_types: []
    typical_output_types: []
    example_tools:
    - geophysics_upward_continuation
  vector_area_statistics:
    label: vector area statistics
    family: analyze
    typical_input_types:
    - vector
    typical_output_types:
    - statistics
    example_tools:
    - gis_vector_area_stats
  vector_clip:
    label: vector clip
    family: transform
    typical_input_types:
    - vector
    typical_output_types:
    - vector
    example_tools:
    - gis_vector_clip
  vector_convert:
    label: vector convert
    family: transform
    typical_input_types:
    - vector
    typical_output_types:
    - vector
    example_tools:
    - gdal.vector_convert
  vector_info:
    label: vector info
    family: inspect
    typical_input_types:
    - vector
    typical_output_types:
    - metadata
    example_tools:
    - gdal.vector_info
  vertical_derivative:
    label: vertical derivative
    family: transform
    typical_input_types: []
    typical_output_types: []
    example_tools:
    - geophysics_vertical_derivative
  vertical_integral:
    label: vertical integral
    family: transform
    typical_input_types: []
    typical_output_types: []
    example_tools:
    - geophysics_vertical_integral
deprecated:
  preprocess:
    label: Coarse preprocess umbrella (legacy)
    family: transform
    replacement:
    - raster_reproject
    - raster_clip
    - raster_resample
    - raster_mosaic
    notes: Prefer atomic transform capabilities. remote_sensing_preprocess may keep preprocess during
      migration (CI warning).
capability_families:
  analyze:
    atomic_ids:
    - alteration_detection
    - assay_stats
    - buffer_overlap
    - contour_extract
    - dem_aspect
    - dem_hillshade
    - dem_slope
    - drillhole_validate
    - element_combination
    - element_correlation
    - geochemical_anomaly_detection
    - geochemical_anomaly_mapping
    - geochemical_descriptive_statistics
    - geophysical_anomaly_detection
    - geophysical_anomaly_raster
    - geophysical_evidence_layer
    - geophysical_threshold
    - idw_variance
    - info_extract
    - interactive_segmentation
    - interpolation_grid
    - lineament_extraction
    - multisource_consistency
    - object_detection
    - prospectivity_evidence_weights
    - prospectivity_mapping
    - prospectivity_wofe
    - qaqc_blank
    - qaqc_duplicate
    - qaqc_reliability
    - qaqc_standard
    - semantic_segmentation
    - spatial_interpolation
    - spatial_overlay
    - spatial_uncertainty
    - spectral_index
    - terrain_index
    - vector_area_statistics
  inspect:
    atomic_ids:
    - document_parse
    - literature_search
    - map_assist
    - raster_info
    - vector_info
  transform:
    atomic_ids:
    - analytic_signal
    - coordinate_transform
    - drillhole_cleaning
    - drillhole_composite
    - evidence_align
    - evidence_reclass
    - evidence_stack
    - evidence_vectorize
    - geochemical_data_cleaning
    - geophysical_filter
    - geophysical_grid_io
    - horizontal_derivative
    - raster_calculate
    - raster_clip
    - raster_convert
    - raster_mosaic
    - raster_overviews
    - raster_polygonize
    - raster_reproject
    - raster_resample
    - upward_continuation
    - vector_clip
    - vector_convert
    - vertical_derivative
    - vertical_integral
operation_capability_resolver:
  reproject:
    raster:
    - raster_reproject
    vector:
    - coordinate_transform
  resample:
    raster:
    - raster_resample
  clip:
    raster:
    - raster_clip
    vector:
    - vector_clip
  convert:
    raster:
    - raster_convert
    vector:
    - vector_convert
  overlay:
    vector:
    - spatial_overlay
  calculate:
    raster:
    - spectral_index
  detect:
    raster:
    - object_detection
  segment:
    raster:
    - semantic_segmentation
    - interactive_segmentation
  extract_lineament:
    raster:
    - lineament_extraction
  inspect_metadata:
    raster:
    - raster_info
    vector:
    - vector_info
    map:
    - map_assist
    document:
    - literature_search
  aggregate:
    vector:
    - vector_area_statistics
    table:
    - element_combination
  anomaly_detection:
    raster:
    - alteration_detection
    table:
    - geochemical_anomaly_detection
    - geophysical_anomaly_detection
  # preprocess is deprecated family-level operation — DO NOT expand to atomic
  # capabilities here. Resolver returns ambiguous/empty for coarse preprocess.
  # See deprecated.preprocess.replacement for migration hints only.
