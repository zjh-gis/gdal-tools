  lineament_extraction:
    label: lineament extraction
    family: analyze
    typical_input_types:
    - remote_sensing_raster
    typical_output_types:
    - lineament_vector
    example_tools:
    - lineament_extraction
  literature_search:
    label: literature search
    family: inspect
    typical_input_types:
