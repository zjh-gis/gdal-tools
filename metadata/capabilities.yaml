  geophysical_evidence_layer:
    label: geophysical evidence layer
    family: analyze
    typical_input_types: []
    typical_output_types: []
    example_tools:
    - geophysics_evidence_reclass
    - geophysics_evidence_stack
    - geophysics_grid_align
  geophysical_filter:
    label: geophysical filter
    family: transform
    typical_input_types:
