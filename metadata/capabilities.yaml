    family: analyze
    typical_input_types:
    - raster
    typical_output_types:
    - raster
    example_tools:
    - gdal.dem_slope
  dem_aspect:
    label: dem aspect
    family: analyze
    definition: Downslope direction of each DEM cell in degrees.
    typical_input_types:
    - raster
    typical_output_types:
    - raster
    example_tools:
    - gdal.dem_aspect
  dem_hillshade:
    label: dem hillshade
    family: analyze
    definition: Shaded-relief rendering of a DEM for a given light direction.
    typical_input_types:
    - raster
    typical_output_types:
    - raster
    example_tools:
    - gdal.dem_hillshade
  terrain_index:
    label: terrain index
    family: analyze
    definition: Terrain ruggedness (TRI), topographic position (TPI) or roughness from a DEM.
    typical_input_types:
    - raster
    typical_output_types:
    - raster
    example_tools:
    - gdal.dem_terrain_index
  document_parse:
    label: document parse
    family: inspect
    typical_input_types:
    - document
    typical_output_types:
    - document
    example_tools:
    - document_parse
  drillhole_cleaning:
    label: drillhole cleaning
    family: transform
    typical_input_types: []
    typical_output_types: []
    example_tools:
    - drillhole_cleaning
  drillhole_composite:
    label: drillhole composite
    family: transform
    typical_input_types: []
    typical_output_types: []
    example_tools:
    - drillhole_composite
  drillhole_validate:
    label: drillhole validate
    family: analyze
    typical_input_types: []
    typical_output_types: []
    example_tools:
    - drillhole_from_to_validate
  element_combination:
