# 本包 MCP 对外能力分组。server 与 mcp/gdal-tools-mcp/metadata.yaml 一致。

classes:
  - id: raster_inspect
    server: gdal-tools
    tools: [raster_info]
  - id: raster_transform
    server: gdal-tools
    tools: [raster_convert, raster_warp]
  - id: raster_mosaic
    server: gdal-tools
    tools: [raster_build_vrt, raster_warp]
  - id: raster_calculate
    server: gdal-tools
    tools: [raster_calc]
  - id: raster_overviews
    server: gdal-tools
    tools: [raster_overviews]
  - id: raster_polygonize
    server: gdal-tools
    tools: [raster_polygonize]
  - id: terrain
    server: gdal-tools
    tools: [dem_slope, dem_aspect, dem_hillshade, dem_terrain_index, dem_contour]
  - id: vector_inspect
    server: gdal-tools
    tools: [vector_info]
  - id: vector_transform
    server: gdal-tools
    tools: [vector_convert]

notes: >
  只包含 gdal-tools 已发布的 MCP 工具名。
  运行环境见 metadata/environments.yaml；启动入口见 deploy/docker-compose.yml。
