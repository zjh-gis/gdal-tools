contract_version: "1.0"
tool:
  id: gdal.dem_slope
  version: 1.0.0
  title: DEM 坡度
  description: 用 gdaldem slope 由 DEM 计算坡度（度或百分比）。
  category: terrain
  keywords: [dem, slope, terrain, gdaldem]
interfaces:
  mcp: dem_slope
inputs:
  data_path:
    kind: file
    required: true
    semantic_type: geo:DEM
    formats: [GTiff, COG, VRT, SRTMHGT, AAIGrid, "GDAL:raster"]
    access_modes: [local_file]
    constraints:
      bands: 至少 1 个，band 不超过波段数
      crs: 推荐米制投影坐标系；经纬度 DEM 须设置 scale=111120（否则结果警告）
      vertical_unit: 与水平单位一致，或通过 scale 换算
    description: 输入 DEM 路径（工作区内）
parameters:
  percent: {type: boolean, default: false, description: 输出百分比坡度而不是度}
  scale: {$shared: dem_scale}
  algorithm: {$shared: dem_algorithm}
  compute_edges: {$shared: compute_edges}
  band: {$shared: band}
  creation_options: {$shared: creation_options}
outputs:
  output_path:
    kind: file
    required: true
    semantic_type: geo:SlopeRaster
    format: GTiff
    data_type: Float32
    nodata: -9999
    units: "degree（percent=true 时为 percent）"
    grid: 与输入 DEM 相同（CRS、尺寸、地理变换）
    overwrite: replace
    commit: atomic_when_geotiff
    description: 输出坡度栅格路径（工作区内，推荐 .tif）
execution:
  mode: sync
  long_running: true
  progress: true
  idempotent: true
  side_effects: none
  timeout_seconds: {default: 14400, env: GDAL_COMMAND_TIMEOUT_SECONDS}
  resources: {cpu: 1, memory_mb: 1024, scratch_disk: 约为输入像元数 × 4 字节}
validation:
  pre: [input_exists, paths_in_workspace, output_differs_from_input, band_within_input]
  post: [output_exists_non_empty, raster_readable, crs_preserved, grid_preserved]
  warnings: [geographic_crs_without_scale]
errors: [invalid_argument, path_not_allowed, not_found, gdal_unavailable, gdal_timeout, gdal_failed]
examples:
  - name: 经纬度 DEM 坡度
    arguments:
      data_path: /data/dem/gdem/ASTGTMV003_N39E116_dem.tif
      output_path: /data/out/slope.tif
      scale: 111120
      compute_edges: true
