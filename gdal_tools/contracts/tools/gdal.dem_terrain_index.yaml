contract_version: "1.0"
tool:
  id: gdal.dem_terrain_index
  version: 1.0.0
  title: DEM 地形指数
  description: 用 gdaldem 计算地形起伏指数 TRI、地形位置指数 TPI 或粗糙度 roughness。
  category: terrain
  keywords: [dem, TRI, TPI, roughness, terrain, gdaldem]
interfaces:
  mcp: dem_terrain_index
inputs:
  data_path:
    kind: file
    required: true
    semantic_type: geo:DEM
    formats: [GTiff, COG, VRT, SRTMHGT, AAIGrid, "GDAL:raster"]
    access_modes: [local_file]
    constraints:
      bands: 至少 1 个，band 不超过波段数
      crs: 任意（结果单位为高程单位）
    description: 输入 DEM 路径（工作区内）
parameters:
  metric: {type: string, enum: [TRI, TPI, roughness], default: TRI}
  tri_algorithm: {type: string, enum: [Wilson, Riley], description: 仅 metric=TRI 时有效}
  compute_edges: {$shared: compute_edges}
  band: {$shared: band}
  creation_options: {$shared: creation_options}
outputs:
  output_path:
    kind: file
    required: true
    semantic_type: geo:TerrainIndexRaster
    format: GTiff
    data_type: Float32
    nodata: -9999
    units: 与 DEM 高程单位相同
    grid: 与输入 DEM 相同（CRS、尺寸、地理变换）
    overwrite: replace
    commit: atomic_when_geotiff
    description: 输出地形指数路径（工作区内，推荐 .tif）
execution:
  mode: sync
  long_running: true
  progress: true
  idempotent: true
  side_effects: none
  timeout_seconds: {default: 14400, env: GDAL_COMMAND_TIMEOUT_SECONDS}
  resources: {cpu: 1, memory_mb: 1024, scratch_disk: 约为输入像元数 × 4 字节}
validation:
  pre: [input_exists, paths_in_workspace, output_differs_from_input, band_within_input]
  post: [output_exists_non_empty, raster_readable, crs_preserved, grid_preserved]
errors: [invalid_argument, path_not_allowed, not_found, gdal_unavailable, gdal_timeout, gdal_failed]
examples:
  - name: 地形位置指数
    arguments:
      data_path: /data/dem/srtm/N39E116.hgt
      output_path: /data/out/tpi.tif
      metric: TPI
