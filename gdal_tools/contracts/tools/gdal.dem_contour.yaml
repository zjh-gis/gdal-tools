contract_version: "1.0"
tool:
  id: gdal.dem_contour
  version: 1.0.0
  title: DEM 等值线
  description: 用 gdal_contour 由 DEM 提取等值线或等值面。interval 与 fixed_levels 二选一。
  category: terrain
  keywords: [dem, contour, isolines, gdal_contour]
interfaces:
  mcp: dem_contour
inputs:
  data_path:
    kind: file
    required: true
    semantic_type: geo:DEM
    formats: [GTiff, COG, VRT, SRTMHGT, AAIGrid, "GDAL:raster"]
    access_modes: [local_file]
    constraints: {crs: 任意（输出沿用输入 CRS）}
    description: 输入 DEM 路径（工作区内）
parameters:
  interval: {type: number, exclusiveMinimum: 0, description: 等高距（DEM 高程单位）}
  fixed_levels:
    type: array
    items: {type: number}
    minItems: 1
    description: 指定高程值列表（替代 interval）
  offset: {type: number, description: interval 模式的起算偏移}
  polygons: {type: boolean, default: false, description: 输出等值面（elev_min/elev_max）而不是等值线}
  attribute_name: {$shared: layer_name, default: elev}
  layer_name: {$shared: layer_name, default: contour}
  band: {$shared: band}
  src_nodata: {$shared: nodata}
  output_format: {$shared: vector_format}
  overwrite: {$shared: overwrite}
outputs:
  output_path:
    kind: file
    required: true
    semantic_type: geo:ContourVector
    format: "GPKG | GeoJSON | FlatGeobuf（按后缀或 output_format）"
    constraints: {suffix: [.gpkg, .geojson, .json, .fgb]}
    overwrite: require_flag
    commit: atomic
    description: 输出矢量路径（工作区内）
execution:
  mode: sync
  long_running: true
  progress: true
  idempotent: true
  side_effects: none
  timeout_seconds: {default: 14400, env: GDAL_COMMAND_TIMEOUT_SECONDS}
  resources: {cpu: 1, memory_mb: 1024, scratch_disk: 约等于输出大小}
validation:
  pre: [input_exists, paths_in_workspace, exactly_one_of_interval_fixed_levels, output_absent_or_overwrite]
  post: [output_exists_non_empty, feature_count_reported]
errors: [invalid_argument, path_not_allowed, not_found, output_exists, gdal_unavailable, gdal_timeout, gdal_failed]
examples:
  - name: 50 米等高线
    arguments:
      data_path: /data/dem/gdem/ASTGTMV003_N39E116_dem.tif
      output_path: /data/out/contour_50m.gpkg
      interval: 50
      overwrite: true
