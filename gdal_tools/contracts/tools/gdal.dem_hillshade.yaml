contract_version: "1.0"
tool:
  id: gdal.dem_hillshade
  version: 1.0.0
  title: DEM 山体阴影
  description: 用 gdaldem hillshade 由 DEM 生成山体阴影 Byte 栅格（0 为 nodata）。
  category: terrain
  keywords: [dem, hillshade, shaded relief, gdaldem]
interfaces:
  mcp: dem_hillshade
inputs:
  data_path:
    kind: file
    required: true
    semantic_type: geo:DEM
    formats: [GTiff, COG, VRT, SRTMHGT, AAIGrid, "GDAL:raster"]
    access_modes: [local_file]
    constraints:
      bands: 至少 1 个，band 不超过波段数
      crs: 推荐米制投影坐标系；经纬度 DEM 须设置 scale=111120（否则结果警告）
    description: 输入 DEM 路径（工作区内）
parameters:
  azimuth: {type: number, minimum: 0, maximum: 360, description: 光源方位角（度，缺省 315）；不能与 multidirectional 同用}
  altitude: {type: number, minimum: 0, maximum: 90, description: 光源高度角（度，缺省 45）}
  z_factor: {type: number, exclusiveMinimum: 0, description: 垂直夸张（缺省 1）}
  scale: {$shared: dem_scale}
  shading: {type: string, enum: [default, combined, multidirectional, igor], default: default}
  algorithm: {$shared: dem_algorithm}
  compute_edges: {$shared: compute_edges}
  band: {$shared: band}
  creation_options: {$shared: creation_options}
outputs:
  output_path:
    kind: file
    required: true
    semantic_type: geo:HillshadeRaster
    format: GTiff
    data_type: Byte
    nodata: 0
    grid: 与输入 DEM 相同（CRS、尺寸、地理变换）
    overwrite: replace
    commit: atomic_when_geotiff
    description: 输出山体阴影路径（工作区内，推荐 .tif）
execution:
  mode: sync
  long_running: true
  progress: true
  idempotent: true
  side_effects: none
  timeout_seconds: {default: 14400, env: GDAL_COMMAND_TIMEOUT_SECONDS}
  resources: {cpu: 1, memory_mb: 1024, scratch_disk: 约为输入像元数 × 1 字节}
validation:
  pre: [input_exists, paths_in_workspace, output_differs_from_input, band_within_input]
  post: [output_exists_non_empty, raster_readable, crs_preserved, grid_preserved]
  warnings: [geographic_crs_without_scale]
errors: [invalid_argument, path_not_allowed, not_found, gdal_unavailable, gdal_timeout, gdal_failed]
examples:
  - name: 多方向山体阴影
    arguments:
      data_path: /data/dem/gdem/ASTGTMV003_N39E116_dem.tif
      output_path: /data/out/hillshade.tif
      scale: 111120
      shading: multidirectional
