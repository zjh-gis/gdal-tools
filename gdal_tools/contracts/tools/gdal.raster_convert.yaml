contract_version: "1.0"
tool:
  id: gdal.raster_convert
  version: 1.0.0
  title: 栅格转换/裁剪矩形
  description: 用 gdal_translate 转换格式、选择波段、改变数据类型或按矩形范围截取。
  category: raster
  keywords: [raster, convert, subset, gdal_translate, cog]
interfaces:
  mcp: raster_convert
inputs:
  data_path:
    kind: file
    required: true
    semantic_type: geo:Raster
    formats: ["GDAL:raster"]
    access_modes: [local_file]
    description: 输入栅格路径（工作区内）
parameters:
  output_format: {type: string, enum: [GTiff, COG, VRT, PNG], default: GTiff}
  bands:
    type: array
    items: {type: integer, minimum: 1}
    minItems: 1
    description: 按顺序保留的波段（从 1 开始）
  bbox: {$shared: bbox, description: "矩形范围 [xmin, ymin, xmax, ymax]，坐标系为栅格 CRS（或 bbox_crs）"}
  bbox_crs: {$shared: crs, description: bbox 的坐标系，例如 EPSG:4326}
  output_type: {$shared: data_type}
  nodata: {$shared: nodata, description: 为输出赋 nodata 值（-a_nodata）}
  creation_options: {$shared: creation_options}
outputs:
  output_path:
    kind: file
    required: true
    semantic_type: geo:Raster
    format: "= output_format"
    overwrite: replace
    commit: atomic_when_geotiff
    description: 输出栅格路径（工作区内，推荐 .tif）
execution:
  mode: sync
  long_running: true
  progress: true
  idempotent: true
  side_effects: none
  timeout_seconds: {default: 14400, env: GDAL_COMMAND_TIMEOUT_SECONDS}
  resources: {cpu: 1, memory_mb: 1024, scratch_disk: 约等于输出大小（与输出同目录暂存）}
validation:
  pre: [input_exists, paths_in_workspace, output_differs_from_input]
  post: [output_exists_non_empty, raster_readable]
errors: [invalid_argument, path_not_allowed, not_found, gdal_unavailable, gdal_timeout, gdal_failed]
examples:
  - name: 转为 COG
    arguments:
      data_path: /data/dem/srtm/N39E116.hgt
      output_path: /data/out/N39E116_cog.tif
      output_format: COG
      creation_options: {COMPRESS: DEFLATE}
