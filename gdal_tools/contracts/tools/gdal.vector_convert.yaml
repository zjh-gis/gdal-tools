contract_version: "1.0"
tool:
  id: gdal.vector_convert
  version: 1.0.0
  title: 矢量转换/重投影/过滤
  description: 用 ogr2ogr 转换矢量格式、重投影，或按范围/属性过滤。
  category: vector
  keywords: [vector, convert, reproject, filter, ogr2ogr]
interfaces:
  mcp: vector_convert
inputs:
  data_path:
    kind: file
    required: true
    semantic_type: geo:Vector
    formats: ["OGR:vector"]
    access_modes: [local_file]
    description: 输入矢量路径（工作区内）
parameters:
  output_format: {type: string, enum: [GPKG, GeoJSON, ESRI Shapefile, FlatGeobuf], default: GPKG}
  target_crs: {$shared: crs, description: 重投影目标坐标系，例如 EPSG:4326}
  layer: {type: string, minLength: 1, description: 只转换该源图层}
  bbox: {$shared: bbox, description: "空间过滤 [xmin, ymin, xmax, ymax]（-spat，源 CRS）"}
  where: {type: string, minLength: 1, maxLength: 1000, description: "属性过滤，例如 TYPE = 'fault'"}
  overwrite: {$shared: overwrite}
outputs:
  output_path:
    kind: file
    required: true
    semantic_type: geo:Vector
    format: "= output_format"
    overwrite: require_flag
    commit: direct
    description: 输出矢量路径（工作区内）
execution:
  mode: sync
  long_running: true
  progress: true
  idempotent: true
  side_effects: none
  timeout_seconds: {default: 14400, env: GDAL_COMMAND_TIMEOUT_SECONDS}
  resources: {cpu: 1, memory_mb: 1024, scratch_disk: 约等于输出大小}
validation:
  pre: [input_exists, paths_in_workspace, output_absent_or_overwrite]
  post: [output_exists_non_empty, feature_count_reported]
errors: [invalid_argument, path_not_allowed, not_found, output_exists, gdal_unavailable, gdal_timeout, gdal_failed]
examples:
  - name: 转 GeoJSON 并投影到 WGS84
    arguments:
      data_path: /data/boundary/admin.gpkg
      output_path: /data/out/admin_wgs84.geojson
      output_format: GeoJSON
      target_crs: EPSG:4326
      overwrite: true
